<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Match</title>
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#14121a" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="/static/style.css?v=4" />
</head>
<body>

  <div class="ticket" style="width: 100%; max-width: 380px; padding: 36px 28px;">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="font-family: var(--font-display); font-size: 14px; letter-spacing: 0.2em; color: var(--color-accent-red);">ADMIT TWO</div>
      <h1 style="font-size: 42px;">Movie Match</h1>
      <div style="font-size: 13px; color: var(--color-muted);">swipe together, watch together</div>
    </div>

    <div class="tab-toggle">
      <button id="tab-create-btn" class="active" onclick="showTab('create')">Start Session</button>
      <button id="tab-join-btn" onclick="showTab('join')">Join Session</button>
    </div>

    <!-- CREATE A NEW SESSION -->
    <div id="tab-create" class="tab-panel active">

      <!-- ---- Essentials — always visible ---- -->
      <label for="create-name">Your name</label>
      <input type="text" id="create-name" placeholder="e.g. Alice" />

      <div style="height: 16px;"></div>

      <label>Streaming services (tap to select)</label>
      <div class="service-options" id="service-options">
        <div class="service-chip" data-service="netflix">Netflix</div>
        <div class="service-chip" data-service="prime">Prime Video</div>
        <div class="service-chip" data-service="disney">Disney+</div>
        <div class="service-chip" data-service="mubi">Mubi</div>
        <div class="service-chip" data-service="paramount">Paramount+</div>
        <div class="service-chip selected" data-service="crave">Crave</div>
      </div>

      <div style="height: 20px;"></div>

      <!-- ---- Customize — collapsed by default ---- -->
      <button type="button" class="customize-toggle" id="customize-toggle" onclick="toggleCustomize()">
        <span>Customize</span>
        <span class="chevron" id="customize-chevron">⌄</span>
      </button>

      <div class="customize-panel" id="customize-panel">
       <div class="customize-panel-inner">
        <div style="height: 16px;"></div>

        <label for="create-country">Country</label>
        <select id="create-country" class="select-input">
          <option value="ca" selected>Canada</option>
          <option value="us">United States</option>
          <option value="gb">United Kingdom</option>
          <option value="au">Australia</option>
        </select>

        <div style="height: 16px;"></div>

        <label>Movies or TV shows?</label>
        <div class="tab-toggle" style="margin-bottom: 0;">
          <button type="button" id="show-type-movie-btn" class="active" onclick="setShowType('movie')">Movies</button>
          <button type="button" id="show-type-series-btn" onclick="setShowType('series')">TV Shows</button>
        </div>

        <div style="height: 16px;"></div>

        <label for="create-order-by">Sort by</label>
        <select id="create-order-by" class="select-input">
          <option value="popularity_1year" selected>Popular this year</option>
          <option value="popularity_1month">Popular this month</option>
          <option value="popularity_1week">Popular this week</option>
          <option value="popularity_alltime">Popular all-time</option>
        </select>

        <div style="height: 16px;"></div>

        <label for="create-rating">Minimum rating</label>
        <select id="create-rating" class="select-input">
          <option value="" selected>Any rating</option>
          <option value="5">5+</option>
          <option value="6">6+</option>
          <option value="7">7+</option>
          <option value="8">8+</option>
        </select>

        <div style="height: 16px;"></div>

        <label>Genres (tap to select, optional)</label>
        <div class="service-options" id="genre-options">
          <div class="service-chip" data-genre="action">Action</div>
          <div class="service-chip" data-genre="comedy">Comedy</div>
          <div class="service-chip" data-genre="drama">Drama</div>
          <div class="service-chip" data-genre="horror">Horror</div>
          <div class="service-chip" data-genre="thriller">Thriller</div>
          <div class="service-chip" data-genre="romance">Romance</div>
          <div class="service-chip" data-genre="scifi">Sci-Fi</div>
          <div class="service-chip" data-genre="fantasy">Fantasy</div>
          <div class="service-chip" data-genre="animation">Animation</div>
          <div class="service-chip" data-genre="documentary">Documentary</div>
          <div class="service-chip" data-genre="family">Family</div>
          <div class="service-chip" data-genre="crime">Crime</div>
        </div>

        <div style="height: 16px;"></div>

        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; font-size: 14px;">
          <input type="checkbox" id="create-refresh" style="width: auto;" />
          Force refresh movie data (skip 24hr cache)
        </label>
       </div>
      </div>

      <div style="height: 24px;"></div>

      <button class="btn-primary" style="width: 100%;" onclick="createSession()">
        Create Session
      </button>

      <p class="hint" id="create-error"></p>
    </div>

    <!-- SHARE SCREEN — shown right after a session is created -->
    <div id="tab-share" class="tab-panel">
      <div style="text-align: center;">
        <h2 style="font-size: 22px; margin-bottom: 4px;">Session created!</h2>
        <p class="hint">Send this code to your partner</p>
      </div>

      <div class="session-code" id="share-code">--------</div>

      <button class="btn-primary" style="width: 100%; margin-bottom: 10px;" onclick="copyCode()">
        Copy Code
      </button>
      <button class="btn-primary" style="width: 100%; background: var(--color-accent-teal);" onclick="copyLink()">
        Copy Invite Link
      </button>

      <p class="hint" id="copy-feedback">&nbsp;</p>

      <div style="height: 12px;"></div>

      <button class="btn-primary" style="width: 100%; background: var(--color-card-text);" onclick="continueToSwipe()">
        Continue to Swiping →
      </button>
    </div>


    <!-- JOIN AN EXISTING SESSION -->
    <div id="tab-join" class="tab-panel">
      <label for="join-name">Your name</label>
      <input type="text" id="join-name" placeholder="e.g. Bob" />

      <div style="height: 16px;"></div>

      <label for="join-code">Session code</label>
      <input type="text" id="join-code" placeholder="e.g. a1b2c3d4" />

      <div style="height: 24px;"></div>

      <button class="btn-primary" style="width: 100%;" onclick="joinSession()">
        Join Session
      </button>

      <p class="hint" id="join-error"></p>
    </div>
  </div>

  <script>
    let createdSessionId = null;
    let selectedShowType = 'movie';

    function showTab(name) {
      document.getElementById('tab-create').classList.toggle('active', name === 'create');
      document.getElementById('tab-join').classList.toggle('active', name === 'join');
      document.getElementById('tab-share').classList.toggle('active', name === 'share');

      document.querySelector('.tab-toggle').style.display = name === 'share' ? 'none' : 'flex';

      document.getElementById('tab-create-btn').classList.toggle('active', name === 'create');
      document.getElementById('tab-join-btn').classList.toggle('active', name === 'join');
    }

    function toggleCustomize() {
      const panel = document.getElementById('customize-panel');
      const chevron = document.getElementById('customize-chevron');
      const isOpen = panel.classList.toggle('open');
      chevron.classList.toggle('open', isOpen);
    }

    function setShowType(type) {
      selectedShowType = type;
      document.getElementById('show-type-movie-btn').classList.toggle('active', type === 'movie');
      document.getElementById('show-type-series-btn').classList.toggle('active', type === 'series');
    }

    // If someone opened an invite link (e.g. ?join=a1b2c3d4), jump straight
    // to the Join tab with the code already filled in.
    const inviteCode = new URLSearchParams(window.location.search).get('join');
    if (inviteCode) {
      showTab('join');
      document.getElementById('join-code').value = inviteCode.toLowerCase();
    }

    document.querySelectorAll('#service-options .service-chip').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('selected'));
    });
    document.querySelectorAll('#genre-options .service-chip').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('selected'));
    });

    async function createSession() {
      const name = document.getElementById('create-name').value.trim();
      const errorEl = document.getElementById('create-error');
      errorEl.textContent = '';

      if (!name) {
        errorEl.textContent = 'Please enter your name.';
        return;
      }

      const selectedServices = Array.from(document.querySelectorAll('#service-options .service-chip.selected'))
        .map(chip => chip.dataset.service);

      const selectedGenres = Array.from(document.querySelectorAll('#genre-options .service-chip.selected'))
        .map(chip => chip.dataset.genre);

      const country = document.getElementById('create-country').value;
      const orderBy = document.getElementById('create-order-by').value;
      const minRating = document.getElementById('create-rating').value;
      const forceRefresh = document.getElementById('create-refresh').checked;

      if (selectedServices.length === 0) {
        errorEl.textContent = 'Select at least one streaming service.';
        return;
      }

      let url = `/session/create?services=${selectedServices.join(',')}&country=${country}&order_by=${orderBy}&show_type=${selectedShowType}`;
      if (selectedGenres.length > 0) {
        url += `&genres=${selectedGenres.join(',')}`;
      }
      if (minRating) {
        url += `&min_rating=${minRating}`;
      }
      if (forceRefresh) {
        url += `&refresh=true`;
      }

      try {
        const response = await fetch(url, { method: 'POST' });

        if (!response.ok) throw new Error('Server error');

        const data = await response.json();
        createdSessionId = data.session_id;
        window.creatorName = name;

        document.getElementById('share-code').textContent = data.session_id;
        showTab('share');
      } catch (err) {
        errorEl.textContent = 'Something went wrong creating the session. Is the server running?';
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(createdSessionId);
      flashCopyFeedback('Code copied!');
    }

    function copyLink() {
      const link = `${window.location.origin}/?join=${createdSessionId}`;
      navigator.clipboard.writeText(link);
      flashCopyFeedback('Link copied — send it to your partner!');
    }

    function flashCopyFeedback(message) {
      const el = document.getElementById('copy-feedback');
      el.textContent = message;
      setTimeout(() => { el.textContent = '\u00A0'; }, 2500);
    }

    function continueToSwipe() {
      window.location.href = `/swipe/${createdSessionId}?user=${encodeURIComponent(window.creatorName)}`;
    }

    function joinSession() {
      const name = document.getElementById('join-name').value.trim();
      const code = document.getElementById('join-code').value.trim().toLowerCase();
      const errorEl = document.getElementById('join-error');
      errorEl.textContent = '';

      if (!name || !code) {
        errorEl.textContent = 'Please enter your name and the session code.';
        return;
      }

      window.location.href = `/swipe/${code}?user=${encodeURIComponent(name)}`;
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('Service worker registration failed:', err));
      });
    }
  </script>

</body>
</html>
